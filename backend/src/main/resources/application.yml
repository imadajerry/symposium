server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: symposium-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/symposium}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:jerryPOST0}}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

quickquery:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters}
  token-ttl-seconds: ${JWT_TTL_SECONDS:86400}
  upload-dir: ${UPLOAD_DIR:uploads}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-1.5-flash}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:llama3.1}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
