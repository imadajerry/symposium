server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: knowledge-sharing-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

quickquery:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters}
  token-ttl-seconds: ${JWT_TTL_SECONDS:86400}
  upload-dir: ${UPLOAD_DIR:uploads}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:llama3.1}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
